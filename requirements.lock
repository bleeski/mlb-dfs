# requirements.lock — R7, rewritten under R353 (2026-09-17).
#
# WHAT THIS FILE IS. The one hashed lock. It pins the engine runtime AND the
# test dependencies the gate imports, with sha256 wheel hashes, for every
# interpreter the project runs on. `python tools/env_probe.py --install`
# installs this file and nothing else, so after a successful install
# `python tools/audit.py --run-tests --terse` can reach PASS. That was not true
# before R353 and is the whole reason this file was rewritten
# (see CHANGELOG.md, R353).
#
# WHAT requirements-production.lock IS. A portable, UNHASHED superset verified
# on Windows CPython 3.13.7, used for a `.venv` acceptance run and for
# `tools/verify_engine.py` (which also wants ruff). It is not what the probe
# installs and it is not hash-checked. When a pin moves, move it in BOTH files.
#
# WHAT requirements.txt IS. The cross-platform floors, and the audit's
# import-name source. Not an install path; `pip install -r requirements.txt` is
# denied by the command guard because it resolves whatever PyPI has that day.
#
# MULTIPLE HASHES PER PIN ARE DELIBERATE. pip accepts several `--hash=` lines
# per pin and accepts the wheel matching any one of them. Before R353 this file
# carried ONE hash per package, and for the three binary packages that hash
# belonged to the cp310 wheel. On a cp311 host `--require-hashes` turned that
# into a hard failure reading "THESE PACKAGES DO NOT MATCH THE HASHES ... someone
# may have tampered with them", which is the alarming reading and the wrong one:
# the bytes were authentic, the lock was single-platform. Every binary pin below
# now carries cp310, cp311 and cp313 manylinux x86_64. A host outside that set
# needs its own hashes added here, never `--no-deps` or a fallback resolve.
#
# EVERY TRANSITIVE REQUIREMENT MUST BE PINNED HERE. `--require-hashes` refuses
# the whole install if any requirement of any pinned distribution is not itself
# pinned with `==`. The first cut of R353 left `packaging` out on purpose --
# Debian ships it into the system interpreter WITHOUT a RECORD file, so pip
# cannot uninstall it and a pin fails with "Cannot uninstall packaging 24.0" --
# and CI rejected that in 20 seconds on a clean runner that has no packaging at
# all:
#
#   ERROR: In --require-hashes mode, all requirements must have their versions
#   pinned with ==. These do not:
#       packaging>=20 ... (from pytest==8.4.2->-r requirements.lock)
#
# Both observations are real and they conflict only when installing into a
# SHARED system interpreter. So the install goes into a virtualenv, which has no
# Debian-owned packaging to uninstall, and `packaging` is pinned like everything
# else. `EnvLockTests.test_every_transitive_requirement_is_pinned` now checks
# this property from each installed distribution's own metadata, so the next
# omission fails locally rather than in CI.
#
# NOT PINNED HERE:
#   ruff — a platform-specific Rust binary needed only by tools/verify_engine.py,
#     which is an offline verifier and not the gate. It lives in
#     requirements-production.lock.
#
# Install (cold host), into a virtualenv, never the system interpreter:
#   python tools/env_probe.py --install --venv
# Probe first; install only on failure. The probe is the ONE install path; CI and
# the SessionStart hook both go through it.
#
# Regenerate (after a deliberate version move only; this file changing means
# engine behavior may move under MILP and CSV handling). Hashes come from PyPI's
# JSON API per exact filename, one `--hash` line per supported wheel:
#   python - <<'PY'
#   import json, urllib.request
#   d = json.load(urllib.request.urlopen("https://pypi.org/pypi/<pkg>/<ver>/json"))
#   for f in d["urls"]:
#       print(f["filename"], f["digests"]["sha256"])
#   PY

